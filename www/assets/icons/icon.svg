<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="日记本">
  <defs>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5730"/>
      <stop offset="0.45" stop-color="#6b4226"/>
      <stop offset="1" stop-color="#472810"/>
    </linearGradient>
    <linearGradient id="paper" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#efe1c6"/>
    </linearGradient>
    <linearGradient id="pageShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9ad84" stop-opacity="0.85"/>
      <stop offset="0.25" stop-color="#e8d7b6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dda0"/>
      <stop offset="0.5" stop-color="#c9a227"/>
      <stop offset="1" stop-color="#8f6d12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="112" fill="url(#leather)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="6" y="6" width="500" height="500" rx="108" fill="none" stroke="#2f1a0b" stroke-opacity="0.45" stroke-width="10"/>

  <!-- 书脊 -->
  <rect x="86" y="96" width="40" height="320" rx="14" fill="#3c220f" opacity="0.9"/>
  <rect x="94" y="106" width="10" height="300" rx="5" fill="url(#gold)" opacity="0.75"/>

  <!-- 书页（多层，模拟厚度） -->
  <g>
    <path d="M126 108 h250 a26 26 0 0 1 26 26 v244 a26 26 0 0 1 -26 26 H126 a18 18 0 0 1 -18 -18 V126 a18 18 0 0 1 18 -18 z" fill="#d8c39c" opacity="0.55" transform="translate(9 9)"/>
    <path d="M126 108 h250 a26 26 0 0 1 26 26 v244 a26 26 0 0 1 -26 26 H126 a18 18 0 0 1 -18 -18 V126 a18 18 0 0 1 18 -18 z" fill="#e6d5b2" opacity="0.7" transform="translate(5 5)"/>
    <path d="M126 108 h250 a26 26 0 0 1 26 26 v244 a26 26 0 0 1 -26 26 H126 a18 18 0 0 1 -18 -18 V126 a18 18 0 0 1 18 -18 z" fill="url(#paper)"/>
    <path d="M108 108 h30 v296 h-30 a18 18 0 0 1 -18 -18 V126 a18 18 0 0 1 18 -18 z" fill="url(#pageShade)" opacity="0.75"/>
  </g>

  <!-- 横格线 -->
  <g stroke="#b9a279" stroke-opacity="0.5" stroke-width="6" stroke-linecap="round">
    <line x1="152" y1="196" x2="368" y2="196"/>
    <line x1="152" y1="248" x2="368" y2="248"/>
    <line x1="152" y1="300" x2="330" y2="300"/>
  </g>
  <!-- 竖栏线 -->
  <line x1="144" y1="160" x2="144" y2="356" stroke="#c98b8b" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>

  <!-- 手写的一行字（用曲线示意） -->
  <path d="M170 176 q14 -14 26 0 t26 -4 t22 6 t30 -8" fill="none" stroke="#2b3a55" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
  <path d="M170 228 q18 -12 30 2 t28 -6 t34 8" fill="none" stroke="#2b3a55" stroke-width="9" stroke-linecap="round" opacity="0.78"/>

  <!-- 铅笔 -->
  <g transform="rotate(38 350 330)">
    <rect x="336" y="300" width="34" height="150" rx="6" fill="url(#gold)"/>
    <rect x="336" y="300" width="34" height="150" rx="6" fill="#000" opacity="0.08"/>
    <path d="M336 450 h34 l-17 34 z" fill="#f0dcb4"/>
    <path d="M347 466 l6 18 h-12 z" fill="#3a3226"/>
    <rect x="336" y="278" width="34" height="26" rx="6" fill="#e06a6a"/>
    <rect x="336" y="270" width="34" height="12" rx="5" fill="#b9c2cc"/>
  </g>

  <!-- 一枚小印章 -->
  <g transform="translate(366 356)">
    <circle r="42" fill="none" stroke="#c0392b" stroke-width="7" stroke-opacity="0.85"/>
    <path d="M-18 -6 h36 M-18 8 h36 M-6 -20 v40 M10 -20 v40" stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8" fill="none"/>
  </g>
</svg>
