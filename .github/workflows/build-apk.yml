name: 构建 APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    # 发布到 Releases 需要写权限（默认是只读）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装依赖
        run: npm install

      - name: 生成 Android 工程
        run: npx cap add android

      - name: 同步网页资源
        run: npx cap sync android

      - name: 应用安卓配置补丁（应用名 / 权限 / 图标）
        run: node android-patch.mjs

      # 在仓库 Secrets 里配置 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      # 就会产出「正式签名版」；没配置则产出「调试版」，两者都能直接安装。
      - name: 写入签名配置
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/riji.keystore
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("riji.keystore")
                      storePassword "${{ secrets.KEYSTORE_PASSWORD }}"
                      keyAlias "${{ secrets.KEY_ALIAS }}"
                      keyPassword "${{ secrets.KEY_PASSWORD }}"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: 构建调试版 APK
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: 构建正式签名版 APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 日记本-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # 额外发一份到 Releases：GitHub 的 Artifacts 必须登录才能下载，
      # 手机上下载很麻烦；发到 Releases 后，手机上点链接就能直接装。
      - name: 发布到 Releases（手机可直接下载安装）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            android/app/build/outputs/apk/**/*.apk \
            --title "日记本 APK ${TAG}" \
            --notes "自动构建的安卓安装包。手机浏览器打开本页，点 .apk 下载后即可安装（需允许「安装未知应用」）。" \
            --repo "${{ github.repository }}"
