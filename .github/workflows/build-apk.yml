name: 构建 APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    # 发布到 Releases 需要写权限（默认是只读）
    permissions:
      contents: write
    env:
      # 注意：GitHub Actions 不允许在 if 条件里直接用 secrets，
      # 必须先映射成环境变量，再在 if 里判断 env.*（否则整个 workflow 报 Invalid workflow file）
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 运行器已预装 Android SDK 与 commandline-tools，
      # 不需要再装（android-actions/setup-android 曾在这里下载失败导致构建 7 秒就红）。
      # 这里只做一次确认，万一环境变了也能自动兜底。
      - name: 确认 Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] && [ -z "$ANDROID_SDK_ROOT" ]; then
            for d in /usr/local/lib/android/sdk /opt/android-sdk "$HOME/Android/Sdk"; do
              if [ -d "$d" ]; then
                echo "ANDROID_HOME=$d" >> "$GITHUB_ENV"
                echo "ANDROID_SDK_ROOT=$d" >> "$GITHUB_ENV"
                break
              fi
            done
          fi
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK: $SDK"
          ls "$SDK" 2>/dev/null || true
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::找不到 Android SDK，无法继续编译"
            exit 1
          fi

      - name: 安装依赖
        run: npm install

      - name: 生成 Android 工程
        run: npx cap add android

      # 明确告诉 Gradle SDK 在哪，避免 "SDK location not found"
      - name: 写入 local.properties
        run: echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > android/local.properties

      - name: 同步网页资源
        run: npx cap sync android

      - name: 应用安卓配置补丁（应用名 / 权限 / 图标）
        run: node android-patch.mjs

      # 在仓库 Secrets 里配置 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      # 就会产出「正式签名版」；没配置则产出「调试版」，两者都能直接安装。
      - name: 写入签名配置
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/riji.keystore
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("riji.keystore")
                      storePassword "${{ secrets.KEYSTORE_PASSWORD }}"
                      keyAlias "${{ secrets.KEY_ALIAS }}"
                      keyPassword "${{ secrets.KEY_PASSWORD }}"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: 构建调试版 APK
        if: env.HAS_KEYSTORE != 'true'
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: 构建正式签名版 APK
        if: env.HAS_KEYSTORE == 'true'
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 日记本-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # 额外发一份到 Releases：GitHub 的 Artifacts 必须登录才能下载，
      # 手机上下载很麻烦；发到 Releases 后，手机上点链接就能直接装。
      - name: 发布到 Releases（手机可直接下载安装）
        # 发布失败不影响 apk：apk 已在上一步上传为 Artifact
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            android/app/build/outputs/apk/**/*.apk \
            --title "日记本 APK ${TAG}" \
            --notes "自动构建的安卓安装包。手机浏览器打开本页，点 .apk 下载后即可安装（需允许「安装未知应用」）。" \
            --repo "${{ github.repository }}"
